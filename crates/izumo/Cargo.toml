[package]
name = "izumo"
description = "Standalone Blitz and Boa application shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyrender_vello = { package = "ps-anyrender-vello", version = "^0.14", optional = true }
anyrender_vello_hybrid = { package = "ps-anyrender-vello-hybrid", version = "^0.10", optional = true }
style = { version = "0.20.0", package = "stylo" }
# Plain defaults, which as of ps-blitz 0.4.4 no longer include `system-fonts`.
#
# This first said `default-features = false` and then retyped the six remaining
# defaults by hand to drop the seventh. ps-observability's release branch had
# grown the identical list independently, which is what showed the problem was
# not here: `system-fonts` should never have been a default of `blitz-dom`, and
# every consumer copying its default list is a copy that goes stale the next
# time a default is added. Fixed at the source in pathscale/ps-blitz#87.
# Still named directly: the runtime downcasts a window.s document and reads
# `NodeId` and the `Document` trait. Nothing about roles, names or capture is
# reached from here any more.
blitz-dom = { package = "ps-blitz-dom", version = "^0.6.5", optional = true }
# No `system-fonts`. It reaches `fontique/system` and, on Linux, the
# `yeslogic-fontconfig-sys` system library, so enabling it here would decide
# that every consumer of this crate needs one installed, including a headless
# one that reads no font catalogue. An application that wants the machine's
# fonts asks for them itself, and both consumers already do.
blitz-script = { package = "ps-blitz-script", version = "^0.6.5" }
# The control surface: the vocabulary, the core, and the socket transport this
# runtime serves its own document over. `capture` carries the offscreen paint
# and the diagnostic snapshots, and pulls `engine` and `blitz-shell` with it.
blitz-control-protocol = { version = "^0.7.2", default-features = false, optional = true }
# The window renderer's own alpha mode, which is why this is not optional: the
# offscreen capture that used to need it here is `blitz-control-protocol`'s.
anyrender = { package = "ps-anyrender", version = "^0.13" }
peniko = "0.6"

blitz-shell = { package = "ps-blitz-shell", version = "^0.6.5", default-features = false, features = ["clipboard", "svg"], optional = true }
blitz-traits = { package = "ps-blitz-traits", version = "^0.6.5", optional = true }
http = "1"
# The control protocol owns endpoint framing and its request types.
# The application owns JSON command arguments, replies and event payloads,
# so serialization is a direct dependency here.
serde = "1"
serde_json = "1"
libc = "0.2"
raw-window-handle = "0.6"
url = "2"
winit = "0.31.0-beta.2"
nagoya = { version = "^0.1", optional = true }

[features]
default = ["agent-control", "runtime"]
# Native windows and the event loop. App and its document-thread ingress live
# behind this feature; the renderer is enabled only for window consumers.
runtime = [
    "dep:anyrender_vello",
    "dep:blitz-shell",
    "dep:blitz-dom",
]
# Serve this runtime's own document over the control socket.
#
# The surface itself is `blitz-control-protocol`: `engine` is the core that
# reads and drives a document, `server` is the socket. Neither is this crate.
# What this feature adds here is the wiring: which window's document is the
# active one, the listener's lifetime, and what `Relaunch` and `Quit` mean for
# a process this runtime started.
agent-control = [
    "blitz-control-protocol/engine",
    "blitz-control-protocol/server",
    "blitz-shell/debug-control",
    "dep:blitz-control-protocol",
    "dep:blitz-dom",
    "dep:blitz-traits",
    "dep:nagoya",
]
debug-control = ["blitz-script/debug-control", "blitz-shell/debug-control"]
# Collection, which is where the expense is. The offscreen renderer, the
# snapshot readers and the frame metrics are all `blitz-control-protocol`'s
# `capture`; a shipping build that leaves this off carries none of them.
diagnostics = ["agent-control", "blitz-control-protocol/capture", "debug-control"]
# Swap the general-purpose Vello renderer for the lighter hybrid pipeline.
# UI is overwhelmingly rectangles and text, which Vello tessellates and bins
# through a compute pass built for arbitrary vector art. The hybrid backend
# does far less per primitive, which is the same bet GPUI makes.
hybrid-renderer = ["dep:anyrender_vello_hybrid"]
# Retained feature names for embedders selecting native shell capabilities.
devtools = ["runtime"]
macos-private-api = ["runtime"]

# Only on macOS, and only for the one test that needs a face:
# `setting_a_node_value_replaces_text_and_dispatches_input`. Replacing a
# field's contents rather than appending to them depends on select-all
# selecting something, which depends on the text having shaped, so with no font
# the typed string lands after the old one and the assertion fails for a reason
# that has nothing to do with this crate.
#
# Scoped to the target because of where the face comes from. macOS resolves one
# through Core Text: no `fontconfig`, nothing to install, no system library in
# the graph. On Linux the same feature reaches `parley/system` and then
# `yeslogic-fontconfig-sys`, so there the test is compiled out and this line
# does not apply -- a Linux build of this crate, shipped or under test, links
# nothing.
[target.'cfg(target_os = "macos")'.dev-dependencies]
blitz-dom = { package = "ps-blitz-dom", version = "^0.6.5", features = ["system-fonts"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8.0"

# AppKit, for the window backdrop.
#
# `window_vibrancy::apply_liquid_glass` inserts its glass view as a *subview of
# the renderer's own view*, so the glass sits on top of the content and frosts
# the application. A window backdrop has to be a sibling behind the renderer, in
# the window's `contentView`, which needs the view hierarchy directly. Versions
# match what `window-vibrancy` already resolves so there is one copy of each.
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = [
    "std",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSColor",
    "NSGlassEffectView",
    "NSResponder",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = ["std", "NSGeometry"]
