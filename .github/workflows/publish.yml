name: Publish crates

# Manual only; releases are normally published locally after the merge.
on:
  workflow_dispatch:

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish runtime
    if: github.ref == 'refs/heads/master'
    # The runtime is macOS-only. Verifying its package on Ubuntu pulls Tauri's
    # GTK backend and fails before publication on missing system GLib.
    runs-on: namespace-profile-agency-tahoe
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh -eo pipefail {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Publish runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --registry crates-io -p izumo
